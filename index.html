<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Hotel AI Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .chat-bubble-ai { background: #f0fdf4; border: 1px solid #bbf7d0; }
        .chat-bubble-user { background: #eff6ff; border: 1px solid #bfdbfe; }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API = "http://localhost:8000/api/v1";

        // ─── Utility: Generate UUID ───
        const uuid = () => crypto.randomUUID();

        // ─── Main App Component ───
        function App() {
        const [page, setPage] = useState("dashboard");
        
        // ─── LIFTED CHAT STATE (Persists across tab switches) ───
        const [chatMessages, setChatMessages] = useState([
            { role: "ai", content: "Hello! I'm your Hotel AI Assistant. I can manage customers, rooms, bookings, and billing. Try asking me:\n• 'Show available double rooms'\n• 'Add customer John Doe, john@email.com, 555-0101'\n• 'Book room 201 for customer 1 from 2025-02-01 to 2025-02-05'" }
        ]);
        const [chatThreadId] = useState(uuid());

        return (
            <div className="flex h-screen">
                {/* Sidebar */}
                <div className="w-64 bg-gray-900 text-white flex flex-col">
                    <div className="p-6 border-b border-gray-700">
                        <h1 className="text-xl font-bold">🏨 Grand Hotel</h1>
                        <p className="text-xs text-gray-400 mt-1">AI Management System</p>
                    </div>
                    <nav className="flex-1 p-4 space-y-2">
                        {[
                            ["dashboard", "📊 Dashboard"],
                            ["chat", "🤖 AI Agent Chat"],
                            ["customers", "👤 Customers"],
                            ["rooms", "🛏️ Rooms"],
                            ["bookings", "📋 Bookings"],
                        ].map(([id, label]) => (
                            <button
                                key={id}
                                onClick={() => setPage(id)}
                                className={`w-full text-left px-4 py-3 rounded-lg transition ${
                                    page === id ? "bg-blue-600" : "hover:bg-gray-700"
                                }`}
                            >
                                {label}
                            </button>
                        ))}
                    </nav>
                </div>

                {/* Main Content */}
                <div className="flex-1 overflow-auto">
                    {page === "dashboard" && <Dashboard />}
                    {page === "chat" && (
                        <AIChat 
                            messages={chatMessages} 
                            setMessages={setChatMessages} 
                            threadId={chatThreadId} 
                        />
                    )}
                    {page === "customers" && <Customers />}
                    {page === "rooms" && <Rooms />}
                    {page === "bookings" && <Bookings />}
                </div>
            </div>
        );
    }
        // ═══════════════════════════════════════════
        // 📊 DASHBOARD
        // ═══════════════════════════════════════════
        function Dashboard() {
            const [stats, setStats] = useState(null);
            useEffect(() => {
                fetch(`${API}/stats`).then(r => r.json()).then(setStats);
            }, []);

            if (!stats) return <div className="p-8">Loading...</div>;

            return (
                <div className="p-8">
                    <h2 className="text-2xl font-bold mb-6">Dashboard</h2>
                    <div className="grid grid-cols-4 gap-6">
                        {[
                            ["👥 Customers", stats.customers, "bg-blue-500"],
                            ["🛏️ Total Rooms", stats.rooms.total, "bg-purple-500"],
                            ["✅ Available", stats.rooms.available, "bg-green-500"],
                            ["🔒 Occupied", stats.rooms.occupied, "bg-red-500"],
                            ["📋 Active Bookings", stats.active_bookings, "bg-yellow-500"],
                            ["💰 Revenue", `$${stats.total_revenue}`, "bg-emerald-600"],
                            ["📈 Occupancy", `${stats.occupancy_rate}%`, "bg-indigo-500"],
                        ].map(([label, value, color]) => (
                            <div key={label} className={`${color} text-white p-6 rounded-xl shadow-lg`}>
                                <p className="text-sm opacity-80">{label}</p>
                                <p className="text-3xl font-bold mt-2">{value}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════
        // 🤖 AI CHAT (Uses all LangGraph Tools)
        // ═══════════════════════════════════════════
        function AIChat({ messages, setMessages, threadId }) {
        const [input, setInput] = useState("");
        const [loading, setLoading] = useState(false);
        const chatEnd = useRef(null);

        const scrollToBottom = () => {
            chatEnd.current?.scrollIntoView({ behavior: "smooth" });
        };

        useEffect(() => { scrollToBottom(); }, [messages]);

        const sendMessage = async () => {
            if (!input.trim() || loading) return;
            const userMsg = input.trim();
            setInput("");
            setMessages(prev => [...prev, { role: "user", content: userMsg }]);
            setLoading(true);

            try {
                const res = await fetch(`${API}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userMsg, thread_id: threadId })
                });
                const data = await res.json();
                setMessages(prev => [...prev, { role: "ai", content: data.reply }]);
            } catch (err) {
                setMessages(prev => [...prev, { role: "ai", content: "❌ Error connecting to AI agent." }]);
            }
            setLoading(false);
        };

        return (
            <div className="flex flex-col h-screen">
                <div className="p-6 border-b bg-white">
                    <h2 className="text-2xl font-bold">🤖 AI Agent Chat</h2>
                    <p className="text-sm text-gray-500">Thread ID: {threadId}</p>
                </div>
                
                <div className="flex-1 overflow-auto p-6 space-y-4 bg-gray-100">
                    {messages.map((msg, i) => (
                        <div key={i} className={`flex ${msg.role === "user" ? "justify-end" : "justify-start"}`}>
                            <div className={`max-w-2xl p-4 rounded-xl whitespace-pre-wrap ${
                                msg.role === "user" ? "chat-bubble-user" : "chat-bubble-ai"
                            }`}>
                                <p className="text-xs font-semibold mb-1 text-gray-500">
                                    {msg.role === "user" ? "👤 You" : "🤖 AI Agent"}
                                </p>
                                <div
                                    dangerouslySetInnerHTML={{
                                        __html: marked.parse(msg.content || "")
                                    }}
                                />
                            </div>
                        </div>
                    ))}
                    {loading && (
                        <div className="flex justify-start">
                            <div className="chat-bubble-ai p-4 rounded-xl">
                                <p className="text-gray-500 animate-pulse">Thinking...</p>
                            </div>
                        </div>
                    )}
                    <div ref={chatEnd} />
                </div>

                <div className="p-4 bg-white border-t">
                    <div className="flex gap-4">
                        <input
                            className="flex-1 border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Ask the AI agent... (e.g., Book room 201 for John from 2025-02-01 to 2025-02-05)"
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onKeyDown={(e) => e.key === "Enter" && sendMessage()}
                        />
                        <button
                            onClick={sendMessage}
                            disabled={loading}
                            className="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 disabled:opacity-50"
                        >
                            Send
                        </button>
                    </div>
                </div>
            </div>
        );
    }

        // ═══════════════════════════════════════════
        // 👤 CUSTOMERS
        // ═══════════════════════════════════════════
        function Customers() {
            const [customers, setCustomers] = useState([]);
            const [form, setForm] = useState({ name: "", email: "", phone: "", address: "" });
            const [search, setSearch] = useState("");

            const fetchCustomers = () => {
                const q = search ? `?search=${search}` : "";
                fetch(`${API}/customers${q}`).then(r => r.json()).then(setCustomers);
            };

            useEffect(() => { fetchCustomers(); }, []);

            const addCustomer = async (e) => {
                e.preventDefault();
                const res = await fetch(`${API}/customers`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(form)
                });
                if (res.ok) {
                    setForm({ name: "", email: "", phone: "", address: "" });
                    fetchCustomers();
                } else {
                    const err = await res.json();
                    alert(err.detail);
                }
            };

            const deleteCustomer = async (id) => {
                if (!confirm("Delete this customer?")) return;
                await fetch(`${API}/customers/${id}`, { method: "DELETE" });
                fetchCustomers();
            };

            return (
                <div className="p-8">
                    <h2 className="text-2xl font-bold mb-6">Customers</h2>
                    
                    {/* Add Form */}
                    <form onSubmit={addCustomer} className="bg-white p-6 rounded-xl shadow mb-6 grid grid-cols-5 gap-4 items-end">
                        <div>
                            <label className="block text-sm font-medium mb-1">Name</label>
                            <input className="w-full border rounded px-3 py-2" required value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-1">Email</label>
                            <input className="w-full border rounded px-3 py-2" type="email" required value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-1">Phone</label>
                            <input className="w-full border rounded px-3 py-2" required value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} />
                        </div>
                        <div>
                            <label className="block text-sm font-medium mb-1">Address</label>
                            <input className="w-full border rounded px-3 py-2" value={form.address} onChange={e => setForm({...form, address: e.target.value})} />
                        </div>
                        <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 h-10">Add</button>
                    </form>

                    {/* Search */}
                    <div className="flex gap-2 mb-4">
                        <input className="border rounded px-3 py-2 flex-1" placeholder="Search by name or email..." value={search} onChange={e => setSearch(e.target.value)} />
                        <button onClick={fetchCustomers} className="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300">Search</button>
                    </div>

                    {/* Table */}
                    <div className="bg-white rounded-xl shadow overflow-auto">
                        <table className="w-full text-left">
                            <thead className="bg-gray-50 border-b">
                                <tr>
                                    <th className="px-6 py-3">ID</th>
                                    <th className="px-6 py-3">Name</th>
                                    <th className="px-6 py-3">Email</th>
                                    <th className="px-6 py-3">Phone</th>
                                    <th className="px-6 py-3">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {customers.map(c => (
                                    <tr key={c.id} className="border-b hover:bg-gray-50">
                                        <td className="px-6 py-4">{c.id}</td>
                                        <td className="px-6 py-4 font-medium">{c.name}</td>
                                        <td className="px-6 py-4">{c.email}</td>
                                        <td className="px-6 py-4">{c.phone}</td>
                                        <td className="px-6 py-4">
                                            <button onClick={() => deleteCustomer(c.id)} className="text-red-600 hover:underline">Delete</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════
        // 🛏️ ROOMS
        // ═══════════════════════════════════════════
        function Rooms() {
            const [rooms, setRooms] = useState([]);
            const [priceModal, setPriceModal] = useState(null);
            const [newPrice, setNewPrice] = useState("");

            const fetchRooms = () => {
                fetch(`${API}/rooms`).then(r => r.json()).then(setRooms);
            };

            useEffect(() => { fetchRooms(); }, []);

            const updatePrice = async (roomId) => {
                await fetch(`${API}/rooms/${roomId}/price?new_price=${newPrice}`, { method: "PATCH" });
                setPriceModal(null);
                setNewPrice("");
                fetchRooms();
            };

            const statusColor = {
                available: "bg-green-100 text-green-800",
                occupied: "bg-red-100 text-red-800",
                maintenance: "bg-yellow-100 text-yellow-800"
            };

            return (
                <div className="p-8">
                    <h2 className="text-2xl font-bold mb-6">Rooms</h2>
                    
                    <div className="bg-white rounded-xl shadow overflow-auto">
                        <table className="w-full text-left">
                            <thead className="bg-gray-50 border-b">
                                <tr>
                                    <th className="px-6 py-3">ID</th>
                                    <th className="px-6 py-3">Room #</th>
                                    <th className="px-6 py-3">Type</th>
                                    <th className="px-6 py-3">Price/Night</th>
                                    <th className="px-6 py-3">Capacity</th>
                                    <th className="px-6 py-3">Status</th>
                                    <th className="px-6 py-3">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {rooms.map(r => (
                                    <tr key={r.id} className="border-b hover:bg-gray-50">
                                        <td className="px-6 py-4">{r.id}</td>
                                        <td className="px-6 py-4 font-bold">{r.room_number}</td>
                                        <td className="px-6 py-4 capitalize">{r.room_type}</td>
                                        <td className="px-6 py-4">${r.price_per_night}</td>
                                        <td className="px-6 py-4">{r.capacity}</td>
                                        <td className="px-6 py-4">
                                            <span className={`px-2 py-1 rounded-full text-xs font-semibold ${statusColor[r.status] || ""}`}>
                                                {r.status.toUpperCase()}
                                            </span>
                                        </td>
                                        <td className="px-6 py-4">
                                            <button onClick={() => { setPriceModal(r.id); setNewPrice(r.price_per_night); }} className="text-blue-600 hover:underline text-sm">
                                                Change Price
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* Price Update Modal */}
                    {priceModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded-xl shadow-xl w-96">
                                <h3 className="text-lg font-bold mb-4">Update Price for Room ID: {priceModal}</h3>
                                <input type="number" step="0.01" className="w-full border rounded px-3 py-2 mb-4" value={newPrice} onChange={e => setNewPrice(e.target.value)} />
                                <div className="flex gap-2">
                                    <button onClick={() => updatePrice(priceModal)} className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 flex-1">Save</button>
                                    <button onClick={() => setPriceModal(null)} className="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300 flex-1">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ═══════════════════════════════════════════
        // 📋 BOOKINGS
        // ═══════════════════════════════════════════
        function Bookings() {
            const [bookings, setBookings] = useState([]);
            const [showForm, setShowForm] = useState(false);
            const [form, setForm] = useState({ customer_id: "", room_id: "", check_in: "", check_out: "" });
            const [payModal, setPayModal] = useState(null);

            const fetchBookings = () => {
                fetch(`${API}/bookings`).then(r => r.json()).then(setBookings);
            };

            useEffect(() => { fetchBookings(); }, []);

            const createBooking = async (e) => {
                e.preventDefault();
                const res = await fetch(`${API}/bookings`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        ...form,
                        customer_id: parseInt(form.customer_id),
                        room_id: parseInt(form.room_id)
                    })
                });
                if (res.ok) {
                    setShowForm(false);
                    setForm({ customer_id: "", room_id: "", check_in: "", check_out: "" });
                    fetchBookings();
                } else {
                    const err = await res.json();
                    alert(err.detail);
                }
            };

            const action = async (id, type) => {
                await fetch(`${API}/bookings/${id}/${type}`, { method: "PATCH" });
                fetchBookings();
            };

            const processPayment = async () => {
                const res = await fetch(`${API}/payments`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ booking_id: payModal.id, amount: payModal.amount, method: "card" })
                });
                if (res.ok) {
                    setPayModal(null);
                    fetchBookings();
                } else {
                    const err = await res.json();
                    alert(err.detail);
                }
            };

            const statusColor = {
                confirmed: "bg-blue-100 text-blue-800",
                checked_in: "bg-green-100 text-green-800",
                checked_out: "bg-gray-100 text-gray-800",
                cancelled: "bg-red-100 text-red-800"
            };

            return (
                <div className="p-8">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold">Bookings</h2>
                        <button onClick={() => setShowForm(!showForm)} className="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                            + New Booking
                        </button>
                    </div>

                    {showForm && (
                        <form onSubmit={createBooking} className="bg-white p-6 rounded-xl shadow mb-6 grid grid-cols-5 gap-4 items-end">
                            <div>
                                <label className="block text-sm font-medium mb-1">Customer ID</label>
                                <input type="number" className="w-full border rounded px-3 py-2" required value={form.customer_id} onChange={e => setForm({...form, customer_id: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Room ID</label>
                                <input type="number" className="w-full border rounded px-3 py-2" required value={form.room_id} onChange={e => setForm({...form, room_id: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Check-in</label>
                                <input type="date" className="w-full border rounded px-3 py-2" required value={form.check_in} onChange={e => setForm({...form, check_in: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Check-out</label>
                                <input type="date" className="w-full border rounded px-3 py-2" required value={form.check_out} onChange={e => setForm({...form, check_out: e.target.value})} />
                            </div>
                            <button type="submit" className="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 h-10">Create</button>
                        </form>
                    )}

                    <div className="bg-white rounded-xl shadow overflow-auto">
                        <table className="w-full text-left">
                            <thead className="bg-gray-50 border-b">
                                <tr>
                                    <th className="px-4 py-3">ID</th>
                                    <th className="px-4 py-3">Customer</th>
                                    <th className="px-4 py-3">Room</th>
                                    <th className="px-4 py-3">Check-in</th>
                                    <th className="px-4 py-3">Check-out</th>
                                    <th className="px-4 py-3">Total</th>
                                    <th className="px-4 py-3">Status</th>
                                    <th className="px-4 py-3">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {bookings.map(b => (
                                    <tr key={b.id} className="border-b hover:bg-gray-50">
                                        <td className="px-4 py-3">{b.id}</td>
                                        <td className="px-4 py-3">{b.customer_id}</td>
                                        <td className="px-4 py-3">{b.room_id}</td>
                                        <td className="px-4 py-3">{b.check_in}</td>
                                        <td className="px-4 py-3">{b.check_out}</td>
                                        <td className="px-4 py-3 font-bold">${b.total_amount}</td>
                                        <td className="px-4 py-3">
                                            <span className={`px-2 py-1 rounded-full text-xs font-semibold ${statusColor[b.status] || ""}`}>
                                                {b.status.replace("_", " ").toUpperCase()}
                                            </span>
                                        </td>
                                        <td className="px-4 py-3 space-x-1">
                                            {b.status === "confirmed" && (
                                                <button onClick={() => action(b.id, "checkin")} className="bg-green-500 text-white px-2 py-1 rounded text-xs hover:bg-green-600">Check-in</button>
                                            )}
                                            {b.status === "checked_in" && (
                                                <button onClick={() => action(b.id, "checkout")} className="bg-gray-500 text-white px-2 py-1 rounded text-xs hover:bg-gray-600">Check-out</button>
                                            )}
                                            {b.status !== "cancelled" && b.status !== "checked_out" && (
                                                <button onClick={() => action(b.id, "cancel")} className="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">Cancel</button>
                                            )}
                                            {b.status !== "cancelled" && (
                                                <button onClick={() => setPayModal({ id: b.id, amount: "" })} className="bg-blue-500 text-white px-2 py-1 rounded text-xs hover:bg-blue-600">Pay</button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* Payment Modal */}
                    {payModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded-xl shadow-xl w-96">
                                <h3 className="text-lg font-bold mb-4">Process Payment for Booking #{payModal.id}</h3>
                                <input type="number" step="0.01" className="w-full border rounded px-3 py-2 mb-4" placeholder="Amount" value={payModal.amount} onChange={e => setPayModal({...payModal, amount: e.target.value})} />
                                <div className="flex gap-2">
                                    <button onClick={processPayment} className="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 flex-1">Pay</button>
                                    <button onClick={() => setPayModal(null)} className="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300 flex-1">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ─── Render ───
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
