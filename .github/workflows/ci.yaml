name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: 'pip' }
      - run: pip install -r requirement.txt
      - name: Import smoke test
        run: python -c "from main import app; print('app loads OK')"
        env:
          SENSNOVA_API_KEY: ${{ secrets.SENSNOVA_API_KEY }}
      - name: Run evals
        run: python -m evals.run_evals
        env:
          SENSNOVA_API_KEY: ${{ secrets.SENSNOVA_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t hotel-ai:${{ github.sha }} .