name: Hotel management AI Agent 

on:
  push:
    branches: [main] 


jobs: 
  build:
    runs-on: ubuntu-latest 

    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4 

      - name: setup python 
        uses: actions/setup-python@v5 
        with: 
          python-version: "3.10" 

      - name: Install Dependencies 
        run: | 
          python -m pip install --upgrade pip 
          pip install -r  requirements.txt 
          pip install flake8

      - name: Lint check 
        run: flake8 . 


      - name: Deploy to Huggingface space 
        if: success() 
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}

        runs: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git clone https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME space-repo

          rsync -av --exclude='.git' ./ space-repo/

          cd space-repo


          git add .
          git commit -m "Auto deploy from GitHub Actions" || echo "No changes"
          git push


